<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
  <title>オレンジ・レモン判定アプリ</title>
  <style>
    /* 全体の背景を爽やかなグラデーションに */
    body {
      background: linear-gradient(135deg, #fff2e6 0%, #fffde6 100%);
      min-height: 100vh;
    }
    /* カード全体のスタイル */
    .app-card {
      border: none;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      background-color: #ffffff;
    }
    /* オレンジ〜レモン風のグラデーションボタン */
    .btn-gradient {
      background: linear-gradient(135deg, #ff9800 0%, #fbc02d 100%);
      color: #ffffff;
      border: none;
      font-weight: bold;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .btn-gradient:hover {
      color: #ffffff;
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(255, 152, 0, 0.35);
    }
    /* Django formのファイル選択フォームの見た目を調整 */
    .form-section p {
      margin-bottom: 0;
    }
    .form-section input[type="file"] {
      display: block;
      width: 100%;
      padding: 0.6rem 1rem;
      font-size: 1rem;
      color: #495057;
      background-color: #fff;
      border: 2px dashed #ffb74d;
      border-radius: 12px;
      cursor: pointer;
    }
  </style>
</head>
<body class="d-flex align-items-center justify-content-center py-5">
  <div class="container" style="max-width: 520px;">
    <div class="card app-card p-4 p-sm-5 text-center">
      
      <h2 class="h4 fw-bold text-dark mb-4">🍊 オレンジかレモンかを画像判定 🍋</h2>

      <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        <div class="form-section mb-4 text-start">
          {{ form.as_p }}
        </div>

        <!-- リアルタイムプレビュー画像（選択時表示） -->
        <div class="mb-4">
          <img id="preview" style="display: none; max-width: 100%; max-height: 250px; margin: 0 auto;" class="img-fluid rounded-3 shadow-sm" alt="プレビュー画像" />
        </div>

        <button type="submit" class="btn btn-gradient btn-lg w-100 py-3 rounded-pill">判定する</button>
      </form>

      <!-- 判定結果表示エリア -->
      {% if prediction %}
        <div id="prediction" class="mt-4 pt-3 border-top">
          <span class="badge bg-warning text-dark fs-6 mb-2">判定結果</span>
          <p class="fs-4 fw-bold text-dark my-2">「<span class="text-danger">{{ prediction }}</span>」でしょう！</p>
          {% if img_url %}
            <div class="mt-3">
              <img src="{{ img_url }}" class="img-fluid rounded-3 shadow-sm" style="max-width: 100%; max-height: 250px;" alt="判定画像">
            </div>
          {% endif %}
        </div>
      {% endif %}

    </div>
  </div>

  <!-- JavaScriptによるプレビュー表示＆切り替え処理（内容は元のまま） -->
  <script>
    const imageInput = document.querySelector('input[type="file"]');
    const previewImage = document.getElementById('preview');
    const predictionDiv = document.getElementById('prediction');

    if (imageInput) {
      imageInput.addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onload = function(e) {
            previewImage.src = e.target.result;
            previewImage.style.display = 'block';
            
            // 新しい画像が選択されたら前回の判定結果を非表示にする
            if (predictionDiv) {
              predictionDiv.style.display = 'none';
            }
          }
          reader.readAsDataURL(file);
        }
      });
    }
  </script>
</body>
</html>
